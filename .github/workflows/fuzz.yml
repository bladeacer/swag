name: Fuzz

on:
  schedule:
    # Every night at 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzParseSRT
          - FuzzParseSBV
          - FuzzParseYTT
          - FuzzParseSRV3
          - FuzzParseASS
          - FuzzParseJSON1
          - FuzzParseVTT
          - FuzzParseTTML
          - FuzzParseKdenlive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
      # Each target runs for a few minutes. With nine targets the nightly
      # session spends roughly half an hour in total.
      - name: fuzz ${{ matrix.target }}
        run: go test ./pkg/sub/ -run=^$ -fuzz=^${{ matrix.target }}$ -fuzztime=3m
      - name: upload the crash corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: pkg/sub/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
