# GoReleaser v2 configuration for swag.
# Snapshot:   goreleaser release --snapshot --clean
# Release:    goreleaser release --clean (the release workflow runs it on a tag)
version: 2

project_name: swag

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: swag
    main: ./cmd/swag
    binary: swag
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
  # The wasm build ships the library for the browser demo under docs/demo/.
  # It has no main package until v1.0.0, so the build id stays skipped.
  - id: swag-wasm
    main: ./cmd/swag-wasm
    binary: swag
    env:
      - CGO_ENABLED=0
    goos:
      - js
    goarch:
      - wasm
    flags:
      - -trimpath
    ldflags:
      - -s -w
    skip: true # flip to false when cmd/swag-wasm lands (v1.0.0)

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE
      - README.md

source:
  enabled: true

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  # The release workflow runs on a version tag, so the result is a real
  # release and not a draft. The body links the changelog file of the tag.
  draft: false
  header: |
    [The release notes for {{ .Tag }}](https://github.com/bladeacer/swag/blob/main/docs/changelogs/{{ .Tag }}.md)
  footer: |
    [The full changelog](https://github.com/bladeacer/swag/blob/main/docs/changelogs/index.md)
