name: Fuzz

on:
  schedule:
    # Every night at 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./pkg/sub/
            target: FuzzParseSRT
          - package: ./pkg/sub/
            target: FuzzParseSBV
          - package: ./pkg/sub/
            target: FuzzParseYTT
          - package: ./pkg/sub/
            target: FuzzParseSRV3
          - package: ./pkg/sub/
            target: FuzzParseASS
          - package: ./pkg/sub/
            target: FuzzParseJSON1
          - package: ./pkg/sub/
            target: FuzzParseVTT
          - package: ./pkg/sub/
            target: FuzzParseTTML
          - package: ./pkg/sub/
            target: FuzzParseKdenlive
          - package: ./internal/config/
            target: FuzzDecode
          - package: ./internal/tui/
            target: FuzzParseTokens
          - package: ./internal/tui/
            target: FuzzNewKeymap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
      # Each target runs for a few minutes. With twelve targets the nightly
      # session spends roughly half an hour in total.
      - name: fuzz ${{ matrix.target }}
        run: go test ${{ matrix.package }} -run=^$ -fuzz=^${{ matrix.target }}$ -fuzztime=3m
      - name: upload the crash corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: ${{ matrix.package }}testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
